name: Release

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Verify tag matches VERSION
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="$(tr -d '[:space:]' < VERSION)"
        if [ -z "$version" ] || [ "$version" != "$TAG" ]; then
          echo "::error::Tag $TAG does not match VERSION file content '$version'."
          exit 1
        fi

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        body: https://github.com/BlazeSnow/TarkovItemManager/blob/main/CHANGELOG.md
        prerelease: ${{ contains(github.ref_name, '-') }}

  build:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux-x64
          binary: tarkov-item-manager
        - os: windows-latest
          platform: windows-x64
          binary: tarkov-item-manager.exe
        - os: macos-latest
          platform: macos-arm64
          binary: tarkov-item-manager
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Enable pnpm
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      run: corepack enable

    - name: Resolve version
      id: version
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$REF_TYPE" = "tag" ]; then
          version="$REF_NAME"
        else
          version="$(tr -d '[:space:]' < VERSION)"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      working-directory: frontend
      run: pnpm build

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Build backend
      shell: bash
      env:
        TARKOV_ITEM_MANAGER_VERSION: ${{ steps.version.outputs.version }}
      run: cargo build --release --manifest-path backend/Cargo.toml

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
        PLATFORM: ${{ matrix.platform }}
        BINARY: ${{ matrix.binary }}
      run: |
        $name = "TarkovItemManager-$env:VERSION_NAME-$env:PLATFORM"
        New-Item -ItemType Directory -Path $name | Out-Null
        Copy-Item "backend/target/release/$env:BINARY" "$name/"
        Compress-Archive -Path $name -DestinationPath "$name.zip"

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
        PLATFORM: ${{ matrix.platform }}
        BINARY: ${{ matrix.binary }}
      run: |
        name="TarkovItemManager-$VERSION_NAME-$PLATFORM"
        mkdir "$name"
        cp "backend/target/release/$BINARY" "$name/"
        chmod +x "$name/$BINARY"
        zip -r "$name.zip" "$name"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: TarkovItemManager-${{ steps.version.outputs.version }}-${{ matrix.platform }}
        path: TarkovItemManager-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
        if-no-files-found: error

    - name: Attach to release
      if: github.ref_type == 'tag'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        ZIP: TarkovItemManager-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
      run: gh release upload "$TAG" "$ZIP" --clobber
